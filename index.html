<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"> 
    <title>Cyber Luxury Christmas 2025</title> 
    <script src="https://res.wx.qq.com/open/js/jweixin-1.6.0.js"></script> 
    <style> 
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', Arial, sans-serif; } 
        #canvas-container { position: fixed; inset: 0; } 
        #title-overlay { 
            position: absolute; top: 8%; width: 100%; text-align: center; z-index: 10; 
            pointer-events: none; font-size: clamp(2.5rem, 8vw, 4rem); font-weight: 900; 
            letter-spacing: 8px; text-transform: capitalize; 
            background: linear-gradient(45deg, #00f2ff 10%, #00ffaa 30%, #ff00e5 50%, #00f2ff 70%, #ffffff 90%); 
            background-size: 200% auto; color: transparent; -webkit-background-clip: text; background-clip: text; 
            animation: shine 3s linear infinite, float 4s ease-in-out infinite; 
            filter: drop-shadow(0 0 20px rgba(0,242,255,0.6)); 
        } 
        #title-overlay::after { 
            content:''; display:block; width:160px; height:2px; margin:12px auto 0; 
            background: linear-gradient(90deg, transparent, #00f2ff, transparent); 
            box-shadow: 0 0 12px #00f2ff; 
        } 
        #music-btn { 
            position: absolute; bottom: 30px; right: 30px; z-index: 100; 
            width: 55px; height: 55px; border-radius: 50%; 
            background: rgba(0, 0, 0, 0.6); border: 2px solid #00f2ff; 
            cursor: pointer; display: flex; align-items: center; justify-content: center; 
            transition: all 0.3s ease; box-shadow: 0 0 15px rgba(0, 242, 255, 0.4); 
        } 
        .icon-music { fill: #00f2ff; width: 28px; height: 28px; transition: fill 0.3s ease; } 
        .playing { animation: pulse 1.5s infinite, colorShift 2s infinite alternate; } 
        @keyframes colorShift { from { border-color: #00f2ff; } to { border-color: #ff00e5; } } 
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } } 
        @keyframes shine { to { background-position: 200% center; } } 
        @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } } 
        /* 音频加载提示 */ 
        #loading-indicator { 
            position: absolute; bottom: 100px; right: 30px; z-index: 99; 
            color: #00f2ff; font-size: 12px; opacity: 0; transition: opacity 0.3s ease; 
            white-space: nowrap; 
        } 
        #loading-indicator.show { opacity: 1; } 
        /* 强制播放提示层 */
        #force-play-layer {
            position: fixed; inset: 0; z-index: 999;
            background: rgba(0,0,0,0.8);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            color: #00f2ff; font-size: 18px;
        }
        #force-play-btn {
            margin-top: 20px;
            padding: 12px 30px;
            border: 2px solid #00f2ff;
            border-radius: 30px;
            background: transparent;
            color: #00f2ff;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0,242,255,0.5);
            transition: all 0.3s ease;
        }
        #force-play-btn:hover {
            background: #00f2ff;
            color: #000;
        }
    </style> 
</head> 
<body> 
    <!-- 强制手动播放提示层（优先显示） -->
    <div id="force-play-layer">
        点击下方按钮播放 Jingle Bells
        <button id="force-play-btn">播放圣诞铃声</button>
    </div>

    <div id="title-overlay">Merry Christmas</div> 
    <div id="music-btn"> 
        <svg class="icon-music play-icon" viewBox="0 0 24 24" style="display:block">
            <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
        </svg>
        <svg class="icon-music pause-icon" viewBox="0 0 24 24" style="display:none">
            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
        </svg>
    </div> 
    <div id="loading-indicator">加载音乐中...</div> 

    <!-- 终极稳定音频源（覆盖全球/无跨域） -->
    <audio id="bg-audio" loop preload="none" volume="0.7">
        <!-- 源1：JSdelivr CDN托管的Jingle Bells（最稳定） -->
        <source src="https://cdn.jsdelivr.net/gh/justinmeister/jingle-bells/jingle-bells.mp3" type="audio/mpeg">
        <!-- 源2：GitHub Raw（备用） -->
        <source src="https://raw.githubusercontent.com/justinmeister/jingle-bells/master/jingle-bells.mp3" type="audio/mpeg">
        <!-- 源3：公共CDN备用 -->
        <source src="https://audio-ssl.itunes.apple.com/apple-assets-us-std-000001/AudioPreview125/v4/6b/86/97/6b8697f9-880a-422c-9c90-29e1996a2f92/mzaf_10776335504501019105.plus.aac.p.m4a" type="audio/mp4">
    </audio> 

    <div id="canvas-container"></div> 

    <script type="importmap"> 
        { "imports": { 
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js", 
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" 
        } } 
    </script> 

    <script type="module"> 
        import * as THREE from 'three'; 
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js'; 
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js'; 
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js'; 

        let scene, camera, renderer, composer, clock; 
        let treePoints, snowSystem, energyCore, ambientParticles; 
        let scanRings = []; 
        const particleCount = 22000; 
        const loader = new THREE.TextureLoader(); 

        /* --- 核心修复：强制手动触发播放 --- */
        const musicBtn = document.getElementById('music-btn');
        const audio = document.getElementById('bg-audio');
        const loadingIndicator = document.getElementById('loading-indicator');
        const playIcon = document.querySelector('.play-icon');
        const pauseIcon = document.querySelector('.pause-icon');
        const forcePlayLayer = document.getElementById('force-play-layer');
        const forcePlayBtn = document.getElementById('force-play-btn');
        
        let isPlaying = false;

        // 第一步：强制用户点击按钮才加载+播放（绕过自动播放限制）
        forcePlayBtn.addEventListener('click', async () => {
            try {
                // 隐藏强制提示层
                forcePlayLayer.style.display = 'none';
                // 显示加载提示
                updateLoadingTip('加载Jingle Bells...');
                
                // 手动加载音频
                await audio.load();
                // 强制播放（用户交互后可播放）
                await audio.play();
                
                isPlaying = true;
                musicBtn.classList.add('playing');
                playIcon.style.display = 'none';
                pauseIcon.style.display = 'block';
                loadingIndicator.classList.remove('show');
            } catch (err) {
                console.error('播放失败:', err);
                updateLoadingTip('播放失败，请点击按钮重试');
                // 重新显示强制层
                forcePlayLayer.style.display = 'flex';
            }
        });

        // 第二步：播放/暂停切换（按钮）
        musicBtn.addEventListener('click', async (e) => {
            e.stopPropagation();
            if (isPlaying) {
                audio.pause();
                isPlaying = false;
                musicBtn.classList.remove('playing');
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
                updateLoadingTip('点击播放Jingle Bells');
            } else {
                try {
                    updateLoadingTip('播放Jingle Bells...');
                    await audio.play();
                    isPlaying = true;
                    musicBtn.classList.add('playing');
                    playIcon.style.display = 'none';
                    pauseIcon.style.display = 'block';
                    loadingIndicator.classList.remove('show');
                } catch (err) {
                    updateLoadingTip('需要重新点击播放');
                    forcePlayLayer.style.display = 'flex'; // 回退到强制层
                }
            }
        });

        // 辅助：更新提示
        function updateLoadingTip(text) {
            loadingIndicator.textContent = text;
            loadingIndicator.classList.add('show');
        }

        // 音频错误处理
        audio.addEventListener('error', (err) => {
            console.error('音频加载错误:', err);
            updateLoadingTip('音频源失效，请刷新重试');
            forcePlayLayer.style.display = 'flex';
        });

        /* --- Three.js 3D场景代码（无修改） --- */
        init();
        animate();

        function init() { 
            clock = new THREE.Clock(); 
            scene = new THREE.Scene(); 
            scene.fog = new THREE.FogExp2(0x000a1a, 0.012); 
            camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000); 
            updateCamera(); 

            renderer = new THREE.WebGLRenderer({ antialias:true }); 
            renderer.setSize(window.innerWidth, window.innerHeight); 
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); 
            document.getElementById('canvas-container').appendChild(renderer.domElement); 

            composer = new EffectComposer(renderer); 
            composer.addPass(new RenderPass(scene, camera)); 
            composer.addPass(new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 2.5, 0.4, 0.1)); 

            createStars(); 
            createSnow(); 
            createTree(); 
            createEnergyCore(); 
            createScanRings(); 
            createAmbientParticles(); 

            treePoints.position.y = 10; 
            scene.add(treePoints); 

            window.addEventListener('resize', onResize); 
        } 

        function updateCamera() { 
            if (window.innerWidth / window.innerHeight < 1) camera.position.set(0, 45, 85); 
            else camera.position.set(0, 35, 65); 
            camera.lookAt(0, 25, 0); 
        } 

        function createTree() { 
            const geo = new THREE.BufferGeometry(); 
            const pos = new Float32Array(particleCount * 3); 
            const col = new Float32Array(particleCount * 3); 
            const size = new Float32Array(particleCount); 
            const palette = [new THREE.Color(0x00f2ff), new THREE.Color(0xff00e5), new THREE.Color(0xffffff)]; 

            for (let i = 0; i < particleCount; i++) { 
                const a = i * 0.15; 
                const r = i * 0.007 * Math.random(); 
                const h = i * 0.018; 

                pos[i*3] = -r * Math.cos(a); 
                pos[i*3+1] = 35 - h; 
                pos[i*3+2] = r * Math.sin(a); 

                const c = palette[Math.floor(Math.random()*3)]; 
                col.set([c.r, c.g, c.b], i*3); 
                size[i] = Math.random()*0.8+0.2; 
            } 

            geo.setAttribute('position', new THREE.BufferAttribute(pos,3)); 
            geo.setAttribute('color', new THREE.BufferAttribute(col,3)); 
            geo.setAttribute('size', new THREE.BufferAttribute(size,1)); 

            const mat = new THREE.ShaderMaterial({ 
                uniforms:{ pointTexture:{ value: loader.load('https://threejs.org/examples/textures/sprites/spark1.png') }}, 
                vertexShader:`attribute float size; varying vec3 vColor; void main(){ vColor = color; vec4 mv = modelViewMatrix * vec4(position,1.0); gl_PointSize = size * (550.0 / -mv.z); gl_Position = projectionMatrix * mv; }`, 
                fragmentShader:`uniform sampler2D pointTexture; varying vec3 vColor; void main(){ gl_FragColor = vec4(vColor*2.2, 1.0)*texture2D(pointTexture,gl_PointCoord); }`, 
                transparent:true, depthTest:false, blending:THREE.AdditiveBlending, vertexColors:true 
            }); 

            treePoints = new THREE.Points(geo, mat); 
        } 

        function createEnergyCore() { 
            const geo = new THREE.IcosahedronGeometry(1.6, 1); 
            const mat = new THREE.MeshBasicMaterial({ color:0x00f2ff, transparent:true, opacity:0.9 }); 
            energyCore = new THREE.Mesh(geo, mat); 
            energyCore.position.y = 47; 
            scene.add(energyCore); 
        } 

        function createScanRings() { 
            for (let i=0; i<3; i++){ 
                const geo = new THREE.TorusGeometry(6+i*1.8, 0.08, 16, 80); 
                const mat = new THREE.MeshBasicMaterial({ color:0x00f2ff, transparent:true, opacity:0.3, blending:THREE.AdditiveBlending }); 
                const ring = new THREE.Mesh(geo, mat); 
                ring.rotation.x = Math.PI/2; 
                ring.position.y = 18 + i*6; 
                scanRings.push(ring); 
                scene.add(ring); 
            } 
        } 

        function createAmbientParticles() { 
            const geo = new THREE.BufferGeometry(); 
            const pos = new Float32Array(800*3); 
            for(let i=0; i<800; i++){ 
                pos[i*3]=THREE.MathUtils.randFloatSpread(250); 
                pos[i*3+1]=Math.random()*150; 
                pos[i*3+2]=THREE.MathUtils.randFloatSpread(250); 
            } 
            geo.setAttribute('position',new THREE.BufferAttribute(pos,3)); 
            ambientParticles = new THREE.Points(geo, new THREE.PointsMaterial({ color:0x00f2ff, size:0.5, transparent:true, opacity:0.2 })); 
            scene.add(ambientParticles); 
        } 

        function createStars() { 
            const g = new THREE.BufferGeometry(); 
            const a=[]; 
            for(let i=0; i<4000; i++) a.push(THREE.MathUtils.randFloatSpread(600), THREE.MathUtils.randFloatSpread(600), THREE.MathUtils.randFloatSpread(600)); 
            g.setAttribute('position', new THREE.Float32BufferAttribute(a,3)); 
            scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color:0x00f2ff, size:0.3, opacity:0.4, transparent:true }))); 
        } 

        function createSnow() { 
            const g = new THREE.BufferGeometry(); 
            const a = []; 
            for(let i=0; i<2000; i++) a.push(THREE.MathUtils.randFloatSpread(250), Math.random()*150, THREE.MathUtils.randFloatSpread(250)); 
            g.setAttribute('position', new THREE.Float32BufferAttribute(a,3)); 
            snowSystem = new THREE.Points(g, new THREE.PointsMaterial({ color:0xffffff, size:0.7, transparent:true, opacity:0.8 })); 
            scene.add(snowSystem); 
        } 

        function animate(){ 
            requestAnimationFrame(animate); 
            const delta = clock.getDelta(); 
            const time = clock.getElapsedTime(); 

            treePoints.rotation.y += delta*0.35; 
            energyCore.rotation.y += delta*1.5; 
            energyCore.scale.setScalar(0.9 + Math.sin(time*3.5)*0.2); 

            scanRings.forEach((r,i)=>{ 
                r.rotation.z += delta*(0.4+i*0.1); 
                r.position.y += delta*2.5; 
                if(r.position.y > 46) r.position.y = 18; 
            }); 

            const s = snowSystem.geometry.attributes.position.array; 
            for(let i=1; i<s.length; i+=3){ 
                s[i]-=delta*18; 
                if(s[i] < -20) s[i] = 130; 
            } 
            snowSystem.geometry.attributes.position.needsUpdate = true; 

            const ap = ambientParticles.geometry.attributes.position.array; 
            for(let i=1; i<ap.length; i+=3){ 
                ap[i]+=delta*3; 
                if(ap[i] > 130) ap[i] = 0; 
            } 
            ambientParticles.geometry.attributes.position.needsUpdate = true; 

            composer.render(); 
        } 

        function onResize(){ 
            camera.aspect = window.innerWidth/window.innerHeight; 
            updateCamera(); 
            camera.updateProjectionMatrix(); 
            renderer.setSize(window.innerWidth, window.innerHeight); 
            composer.setSize(window.innerWidth, window.innerHeight); 
        } 
    </script> 
</body> 
</html>
