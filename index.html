<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Christmas Tree - Visual Only</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Arial', sans-serif; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        #title-overlay {
            position: absolute; top: 30px; width: 100%; text-align: center;
            color: #FFD700; font-family: 'Brush Script MT', cursive; font-size: 4.5rem;
            text-shadow: 0 0 15px #FFD700, 0 0 30px #ff8c00; z-index: 10; pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="title-overlay">Merry Christmas!</div>
    <div id="canvas-container"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';

        let scene, camera, renderer, composer, clock;
        let treePoints, snowSystem;
        let treeMainContainer = new THREE.Group(); 
        let ornamentsGroup = new THREE.Group();

        const particleCount = 18000;
        const textureLoader = new THREE.TextureLoader();

        init();

        function init() {
            clock = new THREE.Clock();
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.012);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            // 调整相机位置，使视角更贴近文字下方的树
            camera.position.set(0, 50, 60); 
            camera.lookAt(0, 48, 0); 

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            setupPostProcessing();
            createStarryBackground();
            createSnow();
            createParticleTree();
            createScatteredDecorations();

            // 将圣诞树容器定位在 y=40，使其紧贴上方文字
            treeMainContainer.add(treePoints);
            treeMainContainer.add(ornamentsGroup);
            treeMainContainer.position.set(0, 40, 0); 
            scene.add(treeMainContainer);

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function setupPostProcessing() {
            const renderScene = new RenderPass(scene, camera);
            const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 2.5, 0.8, 0.1);
            composer = new EffectComposer(renderer);
            composer.addPass(renderScene);
            composer.addPass(bloomPass);
        }

        function createParticleTree() {
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);
            const sizes = new Float32Array(particleCount);
            const colorPalette = [new THREE.Color(0xff2222), new THREE.Color(0xffd700), new THREE.Color(0x00ff88)];

            for (let i = 0; i < particleCount; i++) {
                const angle = i * 0.12;
                const radius = i * 0.007 * Math.random();
                const height = i * 0.018;
                
                positions[i*3] = -radius * Math.cos(angle);
                positions[i*3+1] = 35 - height; 
                positions[i*3+2] = radius * Math.sin(angle);

                const choice = Math.random();
                let col = choice < 0.6 ? colorPalette[2] : (choice < 0.85 ? colorPalette[0] : colorPalette[1]);
                colors[i*3] = col.r; colors[i*3+1] = col.g; colors[i*3+2] = col.b;
                sizes[i] = Math.random() * 0.6 + 0.3;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

            const mat = new THREE.ShaderMaterial({
                uniforms: { pointTexture: { value: textureLoader.load('https://threejs.org/examples/textures/sprites/spark1.png') } },
                vertexShader: `
                    attribute float size; 
                    varying vec3 vColor; 
                    void main() { 
                        vColor = color; 
                        vec4 mvPosition = modelViewMatrix * vec4(position,1.0); 
                        gl_PointSize = size * (450.0 / -mvPosition.z); 
                        gl_Position = projectionMatrix * mvPosition; 
                    }`,
                fragmentShader: `
                    uniform sampler2D pointTexture; 
                    varying vec3 vColor; 
                    void main() { 
                        gl_FragColor = vec4(vColor * 1.8, 1.0) * texture2D(pointTexture, gl_PointCoord); 
                    }`,
                blending: THREE.AdditiveBlending, 
                depthTest: false, 
                transparent: true, 
                vertexColors: true
            });

            treePoints = new THREE.Points(geometry, mat);
        }

        function createScatteredDecorations() {
            const starTex = textureLoader.load('https://threejs.org/examples/textures/sprites/snowflake2.png');
            const sparkTex = textureLoader.load('https://threejs.org/examples/textures/sprites/spark1.png');
            const ornamentColors = [0xff4444, 0xffd700, 0xffffff, 0x00ffcc];
            for (let i = 0; i < 150; i++) {
                const mat = new THREE.SpriteMaterial({
                    map: Math.random() > 0.5 ? starTex : sparkTex,
                    color: ornamentColors[Math.floor(Math.random() * ornamentColors.length)],
                    blending: THREE.AdditiveBlending, transparent: true, opacity: 0.95
                });
                const sprite = new THREE.Sprite(mat);
                const t = Math.random();
                const height = 35 - (t * 32);
                const angle = Math.random() * Math.PI * 2;
                const radius = Math.max(1, t * 11 + (Math.random() - 0.5) * 3);
                sprite.position.set(Math.cos(angle) * radius, height, Math.sin(angle) * radius);
                const s = Math.random() * 1.5 + 0.5;
                sprite.scale.set(s, s, s);
                ornamentsGroup.add(sprite);
            }
        }

        function createStarryBackground() {
            const starsGeometry = new THREE.BufferGeometry();
            const starsVertices = [];
            for (let i = 0; i < 6000; i++) {
                starsVertices.push(THREE.MathUtils.randFloatSpread(400), THREE.MathUtils.randFloatSpread(400), THREE.MathUtils.randFloatSpread(400));
            }
            starsGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starsVertices, 3));
            scene.add(new THREE.Points(starsGeometry, new THREE.PointsMaterial({ color: 0x888888, size: 0.2 })));
        }

        function createSnow() {
            const snowGeometry = new THREE.BufferGeometry();
            const snowVertices = [];
            for (let i = 0; i < 2500; i++) {
                snowVertices.push(THREE.MathUtils.randFloatSpread(200), Math.random() * 120, THREE.MathUtils.randFloatSpread(200));
            }
            snowGeometry.setAttribute('position', new THREE.Float32BufferAttribute(snowVertices, 3));
            snowSystem = new THREE.Points(snowGeometry, new THREE.PointsMaterial({ color: 0xffffff, size: 0.4, transparent: true, opacity: 0.8 }));
            scene.add(snowSystem);
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            // 树持续自转
            treeMainContainer.rotation.y += delta * 0.3;

            // 雪花飘落
            const snowPos = snowSystem.geometry.attributes.position.array;
            for (let i = 1; i < snowPos.length; i += 3) {
                snowPos[i] -= delta * 15; 
                if (snowPos[i] < -20) snowPos[i] = 100;
            }
            snowSystem.geometry.attributes.position.needsUpdate = true;

            composer.render();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight); composer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
